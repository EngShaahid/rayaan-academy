<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Illustration of a learning dashboard with course progress and a lesson video">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B5031D"/><stop offset="1" stop-color="#e2384f"/></linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1f1f1f"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1f1f1f" flood-opacity="0.16"/></filter>
  </defs>
  <circle cx="300" cy="230" r="200" fill="#B5031D" opacity="0.07"/>
  <circle cx="470" cy="80" r="46" fill="#363636" opacity="0.08"/>
  <!-- main window -->
  <g filter="url(#sh)">
    <rect x="40" y="40" width="440" height="300" rx="20" fill="#ffffff"/>
    <rect x="40" y="40" width="440" height="44" rx="20" fill="#f4f4f5"/>
    <rect x="40" y="64" width="440" height="20" fill="#f4f4f5"/>
    <circle cx="66" cy="62" r="6" fill="#B5031D"/><circle cx="86" cy="62" r="6" fill="#d4d4d8"/><circle cx="106" cy="62" r="6" fill="#d4d4d8"/>
    <!-- video -->
    <rect x="62" y="102" width="260" height="150" rx="14" fill="url(#hg2)"/>
    <path d="M62 222 C 140 182, 220 252, 322 196 L322 238 Q322 252 308 252 L76 252 Q62 252 62 238Z" fill="#B5031D" opacity="0.35"/>
    <circle cx="192" cy="176" r="26" fill="#ffffff" opacity="0.95"/>
    <path d="M184 163 L206 176 L184 189Z" fill="#B5031D"/>
    <rect x="62" y="266" width="180" height="12" rx="6" fill="#363636" opacity="0.85"/>
    <rect x="62" y="288" width="240" height="9" rx="4.5" fill="#d4d4d8"/>
    <rect x="62" y="306" width="200" height="9" rx="4.5" fill="#e4e4e7"/>
    <!-- curriculum -->
    <rect x="340" y="102" width="118" height="214" rx="14" fill="#fafafa" stroke="#ececec"/>
    <rect x="354" y="118" width="70" height="9" rx="4.5" fill="#363636"/>
    <g fill="#B5031D"><circle cx="362" cy="150" r="7"/><circle cx="362" cy="180" r="7"/></g>
    <circle cx="362" cy="210" r="7" fill="none" stroke="#B5031D" stroke-width="2.5"/>
    <circle cx="362" cy="240" r="7" fill="none" stroke="#d4d4d8" stroke-width="2.5"/>
    <circle cx="362" cy="270" r="7" fill="none" stroke="#d4d4d8" stroke-width="2.5"/>
    <path d="M358.5 150 l2.5 2.5 l5 -5 M358.5 180 l2.5 2.5 l5 -5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g fill="#d4d4d8"><rect x="376" y="146" width="66" height="8" rx="4"/><rect x="376" y="176" width="58" height="8" rx="4"/><rect x="376" y="206" width="70" height="8" rx="4"/><rect x="376" y="236" width="52" height="8" rx="4"/><rect x="376" y="266" width="62" height="8" rx="4"/></g>
    <rect x="354" y="292" width="90" height="10" rx="5" fill="#ececec"/>
    <rect x="354" y="292" width="54" height="10" rx="5" fill="url(#hg1)"/>
  </g>
  <!-- progress card -->
  <g filter="url(#sh)">
    <rect x="330" y="290" width="200" height="130" rx="18" fill="#ffffff"/>
    <circle cx="384" cy="355" r="34" fill="none" stroke="#f1f1f1" stroke-width="10"/>
    <circle cx="384" cy="355" r="34" fill="none" stroke="#B5031D" stroke-width="10" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="64" transform="rotate(-90 384 355)"/>
    <text x="384" y="361" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#363636">70%</text>
    <rect x="432" y="328" width="76" height="10" rx="5" fill="#363636"/>
    <rect x="432" y="348" width="64" height="8" rx="4" fill="#d4d4d8"/>
    <rect x="432" y="366" width="54" height="8" rx="4" fill="#e4e4e7"/>
  </g>
  <!-- streak card -->
  <g filter="url(#sh)">
    <rect x="10" y="300" width="190" height="96" rx="18" fill="#ffffff"/>
    <g>
      <rect x="30" y="360" width="14" height="18" rx="4" fill="#f3c2c9"/>
      <rect x="52" y="346" width="14" height="32" rx="4" fill="#e7899a"/>
      <rect x="74" y="352" width="14" height="26" rx="4" fill="#f3c2c9"/>
      <rect x="96" y="334" width="14" height="44" rx="4" fill="#B5031D"/>
      <rect x="118" y="342" width="14" height="36" rx="4" fill="#e7899a"/>
      <rect x="140" y="356" width="14" height="22" rx="4" fill="#f3c2c9"/>
      <rect x="162" y="340" width="14" height="38" rx="4" fill="#d14a5e"/>
    </g>
    <rect x="30" y="318" width="90" height="10" rx="5" fill="#363636"/>
  </g>
  <!-- badge -->
  <g filter="url(#sh)">
    <circle cx="500" cy="60" r="36" fill="url(#hg1)"/>
    <path d="M500 40 l6 13 14 2 -10 10 2.5 14 -12.5 -6.6 -12.5 6.6 2.5 -14 -10 -10 14 -2z" fill="#fff"/>
  </g>
</svg>
