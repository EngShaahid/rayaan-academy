<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom | Rayaan Academy</title>
  <meta name="description" content="Rayaan Academy learning classroom.">
  <meta name="theme-color" content="#B5031D">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tailwind Play CDN (development only, see js/tailwind-config.js) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/storage.js"></script>
</head>
<body data-page="learn">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="ra-learn">
    <header class="ra-learn-top">
      <a href="dashboard.html" class="btn ra-icon-btn" aria-label="Back to dashboard"><i class="bi bi-arrow-left" aria-hidden="true"></i></a>
      <button type="button" class="btn ra-icon-btn" id="toggleCurriculum" aria-controls="curriculumPanel" aria-expanded="true" aria-label="Toggle course curriculum"><i class="bi bi-layout-sidebar" aria-hidden="true"></i></button>
      <div class="title">
        <small class="text-muted-ra d-block">Course</small>
        <strong id="learnCourseTitle">Loading course</strong>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="ra-progress" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="learnProgressBar"><span style="width:0%"></span></div>
        <small class="fw-semibold progress-text" id="learnProgressText">0%</small>
      </div>
      <button type="button" class="btn ra-icon-btn" data-action="toggle-theme" aria-label="Switch to dark mode"><i class="bi bi-moon-stars" aria-hidden="true"></i></button>
    </header>

    <div class="ra-learn-body">
      <aside class="offcanvas-lg offcanvas-start ra-curriculum" tabindex="-1" id="curriculumPanel" aria-labelledby="curriculumLabel">
        <div class="offcanvas-header border-bottom">
          <h2 class="offcanvas-title h6 mb-0" id="curriculumLabelMobile">Course content</h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#curriculumPanel" aria-label="Close course content"></button>
        </div>
        <div class="offcanvas-body d-block">
          <div class="ra-curriculum-head">
            <h2 class="h6 mb-1" id="curriculumLabel">Course content</h2>
            <small class="text-muted-ra" id="curriculumSummary"></small>
          </div>
          <nav id="curriculumNav" aria-label="Lessons"></nav>
        </div>
      </aside>

      <main id="main" class="ra-learn-main">
        <div id="learnContent"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/courses-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/learning.js"></script>
</body>
</html>
