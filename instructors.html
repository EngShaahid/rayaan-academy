<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tailwind Play CDN (development only, see js/tailwind-config.js) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/storage.js"></script>

<body data-page="instructors">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="ra-page-hero">
      <div class="container">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb ra-breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Instructors</li></ol></nav>
        <h1>Our instructors</h1>
        <p class="ra-section-lead mb-0">Practitioners who teach the skills they use every day. These are sample profiles for you to replace with your team.</p>
      </div>
    </section>

    <section class="ra-section-sm">
      <div class="container">
        <div class="row g-3 mb-4 align-items-center">
          <div class="col-md-6">
            <div class="ra-search-field" role="search"><i class="bi bi-search" aria-hidden="true"></i>
              <label for="instSearch" class="visually-hidden">Search instructors</label>
              <input type="search" id="instSearch" class="form-control" placeholder="Search by name or role">
            </div>
          </div>
          <div class="col-md-4">
            <label for="instArea" class="visually-hidden">Filter by area</label>
            <select id="instArea" class="form-select"><option value="">All areas</option></select>
          </div>
          <div class="col-md-2 text-md-end small text-muted-ra" id="instCount" aria-live="polite"></div>
        </div>
        <div class="row g-4" id="instructorList"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
