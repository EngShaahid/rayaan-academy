<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Paths | Rayaan Academy</title>
  <meta name="description" content="Structured learning roadmaps for web development, networking, cybersecurity, data science and cloud careers.">
  <meta name="theme-color" content="#B5031D">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Tailwind Play CDN (development only, see js/tailwind-config.js) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/storage.js"></script>
</head>
<body data-page="paths">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="ra-page-hero">
      <div class="container">
        <nav aria-label="Breadcrumb"><ol class="breadcrumb ra-breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Learning Paths</li></ol></nav>
        <h1>Learning paths</h1>
        <p class="ra-section-lead mb-0">Step-by-step roadmaps that combine courses in the right order for a clear career goal.</p>
      </div>
    </section>

    <section class="ra-section-sm">
      <div class="container">
        <div class="d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Filter paths by level">
          <div class="ra-view-toggle">
            <button type="button" class="active is-text" data-path-filter="all" aria-pressed="true">All paths</button>
            <button type="button" class="is-text" data-path-filter="started" aria-pressed="false">Started</button>
            <button type="button" class="is-text" data-path-filter="new" aria-pressed="false">Not started</button>
          </div>
        </div>
        <div class="d-grid gap-4" id="pathList"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/courses-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
